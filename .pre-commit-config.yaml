repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # TRAVIS input files: blank lines are answers (accept default), keep them verbatim
      - id: trailing-whitespace
        exclude: ^(src/mfwater/algo_chemical_model/data/travis_input.*\.txt|test/test_md/data/mfda_reference/.*)$
      - id: end-of-file-fixer
        exclude: ^(src/mfwater/algo_chemical_model/data/travis_input.*\.txt|test/test_md/data/mfda_reference/.*)$
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/asottile/setup-cfg-fmt
    rev: v2.7.0
    hooks:
      - id: setup-cfg-fmt
        args: [--include-version-classifiers, --min-py-version, "3.12", --max-py-version, "3.14"]

  # ruff replaces pyupgrade (UP rules), isort (I rules) and black (ruff-format);
  # rule selection and target version live in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
